    <title>GALETORA</title>
    <script type="module" src="./src/FallingButtons/production/falling-buttons.js"></script>
    <!-- <script  src="./dist/bundle.js"></script> -->

    <script>
        const sb = [
            "In a future",
            "past collapse",
            "past regrowth",
            "past earth"
        ]
        class SB extends HTMLElement {
            async connectedCallback() {
            
               for (const s of sb) {
                   for (const c of s) {
                       this.innerHTML += c;
                        await new Promise(r => setTimeout(r, 100));
                   }
                   if (s === sb[sb.length - 1]) {
                        document.querySelectorAll("falling-buttons").forEach(fb => fb.start());
                   }
                    await new Promise(r => setTimeout(r, 500));
                   this.innerHTML = "";
               }
               document.body.setAttribute("message", "end");
            }
        }
        customElements.define("sb-text", SB);
    </script>
</head>

    body[message="end"] .message {
        opacity: 0;
    }
    body:not([message="end"]) .logo
    , body:not([message="end"]) falling-buttons 
    {
        opacity: 0;
    }

    body[loaded] .logo-big {
        opacity: 0;
    }

    svg {
        width: 50vw;
    }
    falling-buttons {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        opacity: 1;
        transition: opacity 0.5s ease;
    }

    .behind {
        z-index: -1;
    }   
    .centered {
        opacity: 1;
        transition: opacity 0.5s ease;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(calc(180deg + var(--angle, -180deg)));
        text-align: center;
        font-family: "Playfair Display", serif;
        /* font-family: "Libre Caslon Text", serif; */
        /* font-family: Arial, sans-serif; */
        font-size: min(4vw, 2em);
        
    }
    .logo-big {
        opacity: 1;
        transition: opacity 0.5s ease;
    }
    .centered h1, .centered h2 {
        margin: 0;
        font-weight: 400;;
    }
</style>
